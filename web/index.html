<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>共典</title>
<style>
  :root { --bg:#101014; --panel:#181820; --line:#2a2a34; --text:#d8d8e0; --muted:#8a8a96; --accent:#d4a853; --ok:#5fb86c; --warn:#d99a4e; --err:#d4605e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font:15px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; color:var(--accent); font-weight:600; }
  header .meta { color:var(--muted); font-size:12px; }
  header .routes { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
  header .routes a { color:var(--muted); text-decoration:none; font-size:13px; padding:4px 10px; border:1px solid var(--line); border-radius:6px; }
  header .routes a.on { color:var(--text); border-color:var(--accent); }

  /* 聊天式布局：玩家页=对话框+侧边面板；GM页=仪表盘 */
  main.chat { display:grid; grid-template-columns:1fr 300px; height:calc(100vh - 49px); max-width:1100px; margin:0 auto; width:100%; }
  .chat-left { display:flex; flex-direction:column; min-width:0; }
  .stream { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.55; }
  .msg .who { font-size:11px; color:var(--muted); margin-bottom:4px; letter-spacing:.04em; }
  .msg .body { white-space:pre-wrap; word-break:break-word; }
  .msg.narr { align-self:flex-start; background:#1c1c26; border:1px solid var(--line); }
  .msg.player { align-self:flex-end; background:#2a2418; border:1px solid #3d3524; }
  .msg.event { align-self:center; max-width:92%; background:transparent; border:1px dashed var(--line); color:var(--muted); font-size:12.5px; }
  .msg.event b { color:var(--accent); font-weight:500; }
  .msg.event .side-tag { display:inline-block; font-size:10.5px; color:var(--warn); border:1px solid var(--warn); border-radius:4px; padding:0 4px; margin-left:6px; }
  .msg.side { border-style:dashed; opacity:.88; }
  .msg .prop { margin-top:6px; padding:6px 8px; border-left:3px solid var(--accent); background:rgba(212,168,83,.08); font-size:12.5px; color:var(--muted); }
  .empty { color:var(--muted); font-size:13px; font-style:italic; text-align:center; margin:auto; }
  .composer { background:var(--panel); border-top:1px solid var(--line); padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; min-height:0; }
  .chip { background:#20202a; color:var(--text); border:1px solid var(--line); border-radius:20px; padding:7px 14px; font-size:13px; cursor:pointer; transition:border-color .15s,background .15s; }
  .chip:hover { border-color:var(--accent); background:#26232f; }
  .chip:disabled { opacity:.45; cursor:default; }
  .chips .hint { color:var(--muted); font-size:11.5px; align-self:center; }
  .inputrow { display:flex; gap:8px; }
  .inputrow textarea { flex:1; resize:none; min-height:42px; max-height:120px; background:#0d0d12; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; font-size:14px; }
  .inputrow button { background:var(--accent); color:#14140f; border:none; border-radius:10px; padding:0 20px; font:inherit; font-weight:600; cursor:pointer; }
  .inputrow button:disabled { opacity:.5; cursor:default; }
  .busy { color:var(--muted); font-size:12px; text-align:right; }

  /* 玩家侧边面板 */
  .chat-right { background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:14px; }
  .chat-right h3 { margin:0 0 8px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .layer { margin-bottom:10px; }
  .layer h4 { margin:0 0 6px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .layer .kv { display:flex; justify-content:space-between; gap:8px; padding:4px 0; border-bottom:1px dashed var(--line); font-size:12.5px; }
  .layer .kv b { font-weight:500; color:var(--text); }
  .layer .kv span:last-child { color:var(--accent); }
  .rumor { padding:5px 7px; border-left:3px solid var(--warn); background:rgba(217,154,78,.08); border-radius:4px; font-size:12.5px; margin:5px 0; }

  /* GM 仪表盘 */
  main.dash { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px; max-width:1200px; margin:0 auto; }
  main.dash section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; }
  main.dash section.wide { grid-column:1 / -1; }
  main.dash section h2 { margin:0 0 10px; font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.05em; }
  form.narr { display:flex; flex-direction:column; gap:8px; }
  form.narr input, form.narr textarea, form.narr select { background:#0d0d12; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; font-size:13px; }
  form.narr textarea { min-height:56px; resize:vertical; }
  form.narr button { align-self:flex-start; background:var(--accent); color:#14140f; border:none; border-radius:6px; padding:8px 16px; font:inherit; font-weight:600; cursor:pointer; }
  form.narr button:disabled { opacity:.5; cursor:default; }
  .log { margin-top:10px; font-size:12px; color:var(--muted); word-break:break-word; }
  .log .ok { color:var(--ok); }
  .log .err { color:var(--err); }
  .role-panel { margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--line); }
  .role-panel h4 { color:var(--accent); margin:0 0 8px; font-size:14px; }
  @media (max-width:900px) { main.chat { grid-template-columns:1fr; } main.dash { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>共典 · 多人共享世界观</h1>
  <span class="meta" id="meta">连接中…</span>
  <nav class="routes" id="routes"></nav>
</header>

<!-- 玩家对话框（/player/:role）：中间聊天 + 右侧自己的面板 -->
<main class="chat" id="chatMain" style="display:none">
  <div class="chat-left">
    <div class="stream" id="stream"></div>
    <div class="composer">
      <div class="chips" id="chips"><span class="hint">…</span></div>
      <div class="inputrow">
        <textarea id="chatInput" placeholder="自主输入你想做的事，或点上面 LLM 给的选项…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="sendBtn" type="button">发送</button>
      </div>
      <div class="busy" id="busy"></div>
    </div>
  </div>
  <aside class="chat-right" id="playerPanel"><div class="empty">面板加载中…</div></aside>
</main>

<!-- GM 仪表盘（/gm） -->
<main class="dash" id="dashMain" style="display:none">
  <section class="wide">
    <h2>事件流（账本 + 旁支 + 叙事）</h2>
    <div class="log" id="dashStream" style="margin-top:0;max-height:40vh;overflow-y:auto"></div>
  </section>

  <section class="wide">
    <h2>玩家面板（三层：public / private / rumor）</h2>
    <div id="rolePanels"><div class="empty">加载中…</div></div>
  </section>

  <section>
    <h2>缺席简报（rumor 层）</h2>
    <form class="narr" id="briefForm">
      <div style="display:grid;grid-template-columns:1fr;gap:8px">
        <input id="bRole" placeholder="查看哪个角色的简报，如 B" required />
      </div>
      <button type="submit">查看</button>
    </form>
    <div class="log" id="brief"></div>
  </section>

  <section>
    <h2>数值结算（引擎直写）</h2>
    <form class="narr" id="settleForm">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <input id="sActor" placeholder="角色，如 A" required />
        <input id="sFact" placeholder="fact_ref，如 突破成功率" required />
      </div>
      <textarea id="sInputs" placeholder='inputs JSON，如 {"悟性":100,"气运":50,"体魄":200}'></textarea>
      <button type="submit">提交结算</button>
      <div class="log" id="sLog"></div>
    </form>
  </section>

  <section>
    <h2>叙事调试（proposals 分区）</h2>
    <form class="narr" id="narrForm">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <input id="nRole" placeholder="角色，如 A" required />
        <input id="nFact" placeholder="fact_ref（可选）" />
      </div>
      <textarea id="nSlice" placeholder="世界书切片（可选，原文段）"></textarea>
      <button type="submit" id="nBtn">生成叙事</button>
      <div class="log" id="nLog"></div>
    </form>
  </section>

  <section>
    <h2>LLM 配置（009 Q3 单点网关）</h2>
    <div class="log" id="llmStatus" style="margin-bottom:8px">加载中…</div>
    <form class="narr" id="llmForm" style="display:flex;flex-direction:column;gap:8px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <select id="llmProvider">
          <option value="mock">mock（零网络，测试用）</option>
          <option value="openai-compatible">openai-compatible</option>
        </select>
        <input id="llmModel" placeholder="model，缺省 gpt-4o-mini" />
      </div>
      <input id="llmBaseUrl" placeholder="BASE_URL，如 https://api.openai.com/v1 或 http://127.0.0.1:11434/v1" />
      <input id="llmApiKey" type="password" placeholder="API_KEY（打码存储，提交后本地可见）" />
      <button type="submit">保存并热切换</button>
      <div class="log" id="llmLog"></div>
    </form>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const routes = [];
let currentRole = "A";
let isGM = false;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const t = await r.text();
  let j;
  try { j = JSON.parse(t); } catch { j = t; }
  if (!r.ok) throw new Error(path + " -> " + r.status + " " + (j && j.error ? j.error : typeof j === "string" ? j.slice(0,200) : ""));
  return j;
}

function pickRole() {
  const m = location.pathname.match(/^\/player\/([A-Za-z0-9_]+)$/);
  if (location.pathname === "/gm" || location.pathname === "/") { isGM = true; currentRole = "GM"; }
  else if (m) { isGM = false; currentRole = m[1]; }
  else { isGM = false; currentRole = new URLSearchParams(location.search).get("role") || "A"; }
  $("chatMain").style.display = isGM ? "none" : "";
  $("dashMain").style.display = isGM ? "" : "none";
  renderRoutes();
}

function renderRoutes() {
  const nav = $("routes");
  nav.innerHTML = "";
  for (const r of routes) {
    const a = document.createElement("a");
    a.textContent = r;
    a.href = r === "GM" ? "/gm" : "/player/" + r;
    a.className = (r === currentRole) ? "on" : "";
    a.onclick = (e) => { e.preventDefault(); location.href = a.href; };
    nav.appendChild(a);
  }
}

// ---------- 玩家聊天流 ----------
function renderChatStream(ledger) {
  const box = $("stream");
  const all = [...ledger.events.map(e => ({...e, side:false})), ...ledger.sideBranches.map(e => ({...e, side:true}))].sort((a,b) => a.seq - b.seq);
  const parts = all.map(e => {
    const tag = e.side ? ' <span class="side-tag">' + (e.reason_code || "side") + "</span>" : "";
    const val = typeof e.value === "object" ? JSON.stringify(e.value) : String(e.value);
    const radius = e.propagation_radius === "all" ? "公开" : "[" + String(e.propagation_radius) + "]";
    return '<div class="msg event' + (e.side ? " side" : "") + '">' +
      '<b>#' + e.seq + "</b> " + e.kind + " · " + e.fact_ref + " = " + val + tag +
      '<div class="who" style="margin-top:2px">' + e.actor + " · " + radius + " · " + e.canon_status + "</div></div>";
  });
  const props = ledger.proposals || [];
  const propParts = props.map(p =>
    '<div class="msg narr"><div class="who">叙事 · ' + p.role + " · " + p.provider + "</div>" +
    '<div class="body">' + escapeHtml(p.narrative) + "</div>" +
    (p.suggested_value !== null && p.suggested_value !== undefined ?
      '<div class="prop">建议值（未生效，引擎才是结算者）：' + escapeHtml(JSON.stringify(p.suggested_value)) + "</div>" : "") +
    "</div>"
  );
  box.innerHTML = parts.join("") + propParts.join("") || '<div class="empty">账本为空——输入框写下你的第一步，或点 LLM 选项。</div>';
  box.scrollTop = box.scrollHeight;
}

// ---------- 玩家侧边面板（只看自己） ----------
async function renderPlayerPanel() {
  try {
    const p = await api("/api/panel/" + encodeURIComponent(currentRole));
    const l = p.layers || {};
    const mk = (title, obj) => {
      const ks = Object.keys(obj || {});
      if (!ks.length) return '<div class="layer"><h4>' + title + '</h4><div class="empty">（无）</div></div>';
      let body = "";
      for (const k of ks) {
        const v = obj[k];
        body += "<div class='kv'><b>" + k + "</b><span>" + (v && typeof v === "object" ? JSON.stringify(v) : v) + "</span></div>";
      }
      return '<div class="layer"><h4>' + title + "</h4>" + body + "</div>";
    };
    const rumorHtml = (l.rumor && Object.keys(l.rumor).length)
      ? '<div class="layer"><h4>rumor</h4>' + Object.entries(l.rumor).map(([k,v]) =>
          '<div class="rumor"><b>' + k + "</b>（" + v.blur_level + "）" + v.description + "</div>").join("") + "</div>"
      : '<div class="layer"><h4>rumor</h4><div class="empty">（无）</div></div>';
    $("playerPanel").innerHTML =
      '<h3>我的面板 · ' + currentRole + '</h3>' +
      mk("public", l.public) + mk("private", l.private) + rumorHtml;
  } catch { $("playerPanel").innerHTML = '<div class="empty">面板加载失败</div>'; }
}

// ---------- GM 仪表盘 ----------
async function renderGmOverview() {
  try {
    const r = await api("/api/gm/overview");
    const all = [...r.events.map(e => ({...e, side:false})), ...r.sideBranches.map(e => ({...e, side:true}))].sort((a,b) => a.seq - b.seq);
    $("dashStream").innerHTML = all.map(e => {
      const tag = e.side ? ' <span class="side-tag">' + (e.reason_code || "side") + "</span>" : "";
      const val = typeof e.value === "object" ? JSON.stringify(e.value) : String(e.value);
      return '<div class="msg event" style="align-self:flex-start;max-width:100%">#' + e.seq + " · " + e.kind + " · " + e.fact_ref + " = " + val + tag +
        '<div class="who">' + e.actor + " · " + e.canon_status + "</div></div>";
    }).join("") +
    (r.proposals || []).map(p =>
      '<div class="msg narr" style="max-width:100%;align-self:flex-start">' +
      '<div class="who">叙事 · ' + p.role + " · " + p.provider + "（at_seq " + p.at_seq + "）</div>" +
      '<div class="body">' + escapeHtml(p.narrative) + "</div></div>"
    ).join("") || '<div class="empty">账本为空</div>';

    const keys = Object.keys(r.rolePanels || {});
    if (!keys.length) { $("rolePanels").innerHTML = '<div class="empty">暂无玩家角色</div>'; return; }
    $("rolePanels").innerHTML = keys.map(role => {
      const p = r.rolePanels[role];
      const l = p.layers || {};
      const mk = (title, obj) => {
        const ks = Object.keys(obj || {});
        if (!ks.length) return "";
        let body = "";
        for (const k of ks) body += "<div class='kv'><b>" + k + "</b><span>" + (typeof obj[k]==="object" ? JSON.stringify(obj[k]) : obj[k]) + "</span></div>";
        return '<div class="layer"><h4>' + title + "</h4>" + body + "</div>";
      };
      const rumor = (l.rumor && Object.keys(l.rumor).length)
        ? '<div class="layer"><h4>rumor</h4>' + Object.entries(l.rumor).map(([k,v]) =>
            '<div class="rumor"><b>' + k + "</b>（" + v.blur_level + "）" + v.description + "</div>").join("") + "</div>"
        : "";
      return '<div class="role-panel"><h4>角色 ' + role + '</h4>' + mk("public", l.public) + mk("private", l.private) + rumor + '</div>';
    }).join("");
  } catch {}
}

// ---------- 统一刷新 ----------
async function refresh() {
  try {
    const root = await api("/");
    routes.length = 0;
    for (const r of root.roles || []) routes.push(r);
    if (!isGM && !routes.includes(currentRole) && routes.includes("A")) currentRole = "A";
    $("meta").textContent = "seq " + root.seq + " · schema " + root.schema_version + " · LLM " + root.llm + " · 自动刷新 3s";
    renderRoutes();
    if (!isGM) {
      const ledger = await api("/api/ledger");
      renderChatStream(ledger);
      renderPlayerPanel();
    } else {
      renderGmOverview();
    }
  } catch (e) {
    $("meta").textContent = "服务器未连接：" + e.message;
  }
}

// ---------- LLM 快捷选项 ----------
let promptsLoaded = false;
function maybeLoadPrompts(force) {
  if (!isGM && (force || !promptsLoaded)) { promptsLoaded = true; loadPrompts(); }
}
async function loadPrompts() {
  const box = $("chips");
  try {
    const r = await api("/api/prompts/" + encodeURIComponent(currentRole));
    const keys = Object.keys(r.prompts || {});
    if (!keys.length) { box.innerHTML = '<span class="hint">LLM 未给出选项（可自主输入）</span>'; return; }
    box.innerHTML = keys.map(k => '<button class="chip" data-p="' + escapeHtml(k) + '">' + escapeHtml(k) + "</button>").join("");
    for (const b of box.querySelectorAll(".chip")) b.onclick = () => sendNarrative(b.dataset.p);
  } catch { box.innerHTML = '<span class="hint">选项加载失败（可自主输入）</span>'; }
}

async function sendNarrative(text) {
  if (!text || !text.trim()) return;
  $("busy").textContent = "叙事生成中…";
  $("chatInput").value = "";
  const box = $("stream");
  const p = document.createElement("div");
  p.className = "msg player";
  p.innerHTML = '<div class="who">你（' + currentRole + '）</div><div class="body">' + escapeHtml(text) + "</div>";
  box.appendChild(p);
  box.scrollTop = box.scrollHeight;
  try {
    await api("/api/narrative/" + encodeURIComponent(currentRole), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ text }),
    });
    $("busy").textContent = "";
    promptsLoaded = false;
    await refresh();
    maybeLoadPrompts(true);
  } catch (e) {
    $("busy").textContent = "";
    box.insertAdjacentHTML("beforeend", '<div class="msg event" style="border-color:var(--err)">叙事失败：' + escapeHtml(e.message) + "</div>");
    box.scrollTop = box.scrollHeight;
  }
}

$("sendBtn").onclick = () => sendNarrative($("chatInput").value);
$("chatInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("sendBtn").click(); }
});

// ---------- GM 表单 ----------
function log(el, msg, isErr) {
  el.innerHTML = '<div class="' + (isErr ? "err" : "ok") + '">' + escapeHtml(msg) + "</div>" + el.innerHTML;
}
$("settleForm").onsubmit = async (e) => {
  e.preventDefault();
  let inputs = {};
  const raw = $("sInputs").value.trim();
  if (raw) { try { inputs = JSON.parse(raw); } catch { log($("sLog"), "inputs 不是合法 JSON", true); return; } }
  try {
    const r = await api("/api/settle", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ actor:$("sActor").value || "GM", fact_ref:$("sFact").value, inputs }) });
    log($("sLog"), r.ok ? "结算成功 seq=" + r.seq + " → " + JSON.stringify(r.result) : "结算拒绝：" + r.reason, !r.ok);
    refresh();
  } catch (err) { log($("sLog"), "settle 失败：" + err.message, true); }
};
$("narrForm").onsubmit = async (e) => {
  e.preventDefault();
  $("nBtn").disabled = true;
  try {
    const r = await api("/api/narrative/" + encodeURIComponent($("nRole").value || "A"), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ fact_ref:$("nFact").value.trim() || undefined, worldbookSlice:$("nSlice").value.trim() || undefined })
    });
    const p = r.proposal;
    log($("nLog"), '叙事已入 proposals（at_seq=' + p.at_seq + "，" + p.usage.inputTokens + "/" + p.usage.outputTokens + " tokens）：" + p.narrative, false);
    refresh();
  } catch (err) { log($("nLog"), "narrative 失败：" + err.message, true); }
  $("nBtn").disabled = false;
};
$("briefForm").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const r = await api("/api/briefing/" + encodeURIComponent($("bRole").value));
    const items = r.items.map(i => "· " + i.render).join("\n");
    $("brief").innerHTML = items ? "<pre style='white-space:pre-wrap;font-size:13px'>" + escapeHtml(items) + "</pre>" : '<span class="ok">该角色当前无 rumor 层条目。</span>';
  } catch (err) { $("brief").textContent = "briefing 失败：" + err.message; }
};
async function loadLlmConfig() {
  try {
    const r = await api("/api/config/llm");
    $("llmStatus").textContent = "当前：" + (r.current.provider ?? "unknown") + " · live " + r.live;
    if (r.current.provider === "openai-compatible") {
      $("llmProvider").value = "openai-compatible";
      $("llmBaseUrl").value = r.current.baseUrl || "";
      $("llmApiKey").value = r.current.apiKey || "";
      $("llmModel").value = r.current.model && r.current.model !== "gpt-4o-mini" ? r.current.model : "";
    }
  } catch {}
}
$("llmForm").onsubmit = async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  try {
    const r = await api("/api/config/llm", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ provider:$("llmProvider").value, baseUrl:$("llmBaseUrl").value.trim()||undefined,
        apiKey:$("llmApiKey").value.trim()||undefined, model:$("llmModel").value.trim()||undefined }) });
    log($("llmLog"), "已切换 → " + r.live, false);
    refresh();
  } catch (err) { log($("llmLog"), err.message, true); }
  btn.disabled = false;
};

pickRole();
refresh();
maybeLoadPrompts(false);
if (isGM) { loadLlmConfig(); setInterval(loadLlmConfig, 10000); setInterval(refresh, 3000); }
else { setInterval(refresh, 3000); }
</script>
</body>
</html>
