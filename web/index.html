<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>共典</title>
<style>
  :root {
    --paper: #faf6ef;
    --paper-deep: #f3ede3;
    --ink: #2a2420;
    --ink-soft: #5a5248;
    --ink-faint: #8a8278;
    --sienna: #c45d3a;
    --sienna-soft: #e8c4b4;
    --sienna-wash: #fdf5f0;
    --cool: #e8edf2;
    --cool-ink: #3a4a5a;
    --amber: #f5e6d0;
    --amber-ink: #6a5030;
    --amber-line: #d4a060;
    --line: #e0d8cc;
    --ok: #4a8a5a;
    --warn: #c48a30;
    --err: #b04040;
    --font-body: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    --font-narr: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.6 var(--font-body);
  }
  ::selection { background: var(--sienna-soft); }
  a { color: var(--sienna); }

  /* ── Header ── */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px;
    background: var(--paper-deep);
    border-bottom: 2px solid var(--sienna);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; color: var(--sienna); font-weight: 700; letter-spacing: .02em; }
  header .meta { color: var(--ink-soft); font-size: 12px; font-family: var(--font-narr); font-style: italic; }
  header .routes { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  header .routes a {
    color: var(--ink-soft); text-decoration: none; font-size: 13px;
    padding: 5px 14px; border: 1.5px solid var(--line); border-radius: 20px;
    transition: all .15s;
  }
  header .routes a:hover { border-color: var(--sienna); color: var(--sienna); }
  header .routes a.on { background: var(--sienna); color: #fff; border-color: var(--sienna); }

  /* ── Player chat layout ── */
  main.chat {
    display: grid; grid-template-columns: 1fr 340px;
    height: calc(100vh - 53px); max-width: 1200px; margin: 0 auto; width: 100%;
  }
  .chat-left { display: flex; flex-direction: column; min-width: 0; }
  .stream {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .stream::-webkit-scrollbar { width: 6px; }
  .stream::-webkit-scrollbar-track { background: transparent; }
  .stream::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  /* Messages */
  .msg { max-width: 82%; padding: 12px 16px; border-radius: 4px; font-size: 14px; line-height: 1.6; }
  .msg .who { font-size: 11px; color: var(--ink-faint); margin-bottom: 4px; letter-spacing: .03em; text-transform: uppercase; }
  .msg .body { white-space: pre-wrap; word-break: break-word; }

  .msg.narr {
    align-self: flex-start;
    background: #fff; border: 1px solid var(--line);
    font-family: var(--font-narr); font-size: 15px; color: var(--ink);
    box-shadow: 0 2px 8px rgba(42,36,32,.06);
    position: relative;
  }
  .msg.narr::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--sienna); border-radius: 4px 0 0 4px;
  }
  .msg.player {
    align-self: flex-end;
    background: var(--sienna-wash); border: 1px solid var(--sienna-soft);
    font-size: 14px;
  }
  .msg.event {
    align-self: center; max-width: 95%;
    background: var(--paper-deep); border: 1px solid var(--line);
    color: var(--ink-soft); font-size: 12px; padding: 8px 12px;
  }
  .msg.event b { color: var(--sienna); font-weight: 600; }
  .msg.event .side-tag {
    display: inline-block; font-size: 10px; color: var(--warn);
    border: 1px solid var(--warn); border-radius: 3px; padding: 0 4px; margin-left: 6px;
  }
  .msg.side { border-style: dashed; }
  .msg .prop {
    margin-top: 8px; padding: 6px 10px;
    border-left: 3px solid var(--sienna); background: var(--sienna-wash);
    font-size: 12px; color: var(--ink-soft); font-family: var(--font-narr); font-style: italic;
  }
  .empty { color: var(--ink-faint); font-size: 13px; font-style: italic; text-align: center; margin: auto; font-family: var(--font-narr); }

  /* Composer */
  .composer {
    background: var(--paper-deep); border-top: 1px solid var(--line);
    padding: 14px 20px; display: flex; flex-direction: column; gap: 10px;
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: #fff; color: var(--sienna);
    border: 1.5px solid var(--sienna-soft); border-radius: 20px;
    padding: 8px 18px; font-size: 13px; cursor: pointer; font-weight: 500;
    transition: all .15s;
  }
  .chip:hover { background: var(--sienna); color: #fff; border-color: var(--sienna); }
  .chip:disabled { opacity: .4; cursor: default; }
  .chips .hint { color: var(--ink-faint); font-size: 12px; align-self: center; font-style: italic; font-family: var(--font-narr); }
  .inputrow { display: flex; gap: 10px; }
  .inputrow textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 120px;
    background: #fff; color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 14px;
    font: inherit; font-size: 14px; transition: border-color .15s;
  }
  .inputrow textarea:focus { outline: none; border-color: var(--sienna); }
  .inputrow button {
    background: var(--sienna); color: #fff; border: none;
    border-radius: 6px; padding: 0 24px; font: inherit; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  .inputrow button:hover { background: #a84d30; }
  .inputrow button:disabled { opacity: .5; cursor: default; }
  .busy { color: var(--ink-faint); font-size: 12px; text-align: right; font-style: italic; font-family: var(--font-narr); }

  /* Player side panel */
  .chat-right {
    background: var(--paper-deep); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 16px;
  }
  .chat-right h3 {
    margin: 0 0 12px; font-size: 11px; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
  }
  .layer { margin-bottom: 14px; padding: 10px 12px; border-radius: 4px; }
  .layer.pub { background: #fff; border: 1px solid var(--line); }
  .layer.priv { background: var(--cool); border: 1px solid #c8d4e0; }
  .layer.rum { background: var(--amber); border: 1px dashed var(--amber-line); }
  .layer h4 {
    margin: 0 0 8px; font-size: 10px; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: .08em; font-weight: 700;
  }
  .layer.priv h4 { color: var(--cool-ink); }
  .layer.rum h4 { color: var(--amber-ink); }
  .layer .kv {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 3px 0; font-size: 12.5px;
  }
  .layer .kv b { font-weight: 500; color: var(--ink); }
  .layer .kv span:last-child { color: var(--sienna); font-weight: 600; }
  .rumor-item {
    padding: 6px 8px; border-left: 3px dashed var(--amber-line);
    font-size: 12.5px; margin: 6px 0; color: var(--amber-ink);
    font-family: var(--font-narr); font-style: italic;
  }

  /* ── GM dashboard ── */
  main.dash {
    display: flex; flex-direction: column; gap: 16px;
    padding: 16px 20px; max-width: 1200px; margin: 0 auto; width: 100%;
  }
  main.dash section {
    background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 16px;
  }
  main.dash section.wide { }
  main.dash section h2 {
    margin: 0 0 12px; font-size: 11px; color: var(--ink-faint);
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .dash-grid section { min-width: 0; }
  .dash-stream { max-height: 40vh; overflow-y: auto; }
  .dash-stream::-webkit-scrollbar { width: 6px; }
  .dash-stream::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  .role-panel {
    background: var(--paper); border: 1px solid var(--line); border-radius: 4px;
    padding: 12px; margin-bottom: 12px;
  }
  .role-panel h4 { color: var(--sienna); margin: 0 0 10px; font-size: 14px; font-weight: 600; }

  /* Forms */
  form.narr { display: flex; flex-direction: column; gap: 8px; }
  form.narr input, form.narr textarea, form.narr select {
    background: var(--paper); color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 4px;
    padding: 8px 10px; font: inherit; font-size: 13px;
    transition: border-color .15s;
  }
  form.narr input:focus, form.narr textarea:focus { outline: none; border-color: var(--sienna); }
  form.narr textarea { min-height: 56px; resize: vertical; }
  form.narr button {
    align-self: flex-start;
    background: var(--sienna); color: #fff; border: none;
    border-radius: 4px; padding: 8px 20px; font: inherit; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  form.narr button:hover { background: #a84d30; }
  form.narr button:disabled { opacity: .5; cursor: default; }
  .log { margin-top: 8px; font-size: 12px; color: var(--ink-soft); word-break: break-word; }
  .log .ok { color: var(--ok); }
  .log .err { color: var(--err); }

  @media (max-width: 900px) {
    main.chat { grid-template-columns: 1fr; }
    .chat-right { display: none; }
    .dash-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>共典</h1>
  <span class="meta" id="meta">连接中…</span>
  <nav class="routes" id="routes"></nav>
</header>

<!-- 玩家对话框 -->
<main class="chat" id="chatMain" style="display:none">
  <div class="chat-left">
    <div class="stream" id="stream"></div>
    <div class="composer">
      <div class="chips" id="chips"><span class="hint">…</span></div>
      <div class="inputrow">
        <textarea id="chatInput" placeholder="自主输入，或点上面选项…（Enter 发送）"></textarea>
        <button id="sendBtn" type="button">发送</button>
      </div>
      <div class="busy" id="busy"></div>
    </div>
  </div>
  <aside class="chat-right" id="playerPanel"><div class="empty">面板加载中…</div></aside>
</main>

<!-- GM 仪表盘 -->
<main class="dash" id="dashMain" style="display:none">
  <section>
    <h2>事件流 · 账本 + 旁支 + 叙事</h2>
    <div class="dash-stream" id="dashStream"></div>
  </section>

  <section>
    <h2>玩家面板（public / private / rumor）</h2>
    <div id="rolePanels"><div class="empty">加载中…</div></div>
  </section>

  <div class="dash-grid">
    <section>
      <h2>缺席简报</h2>
      <form class="narr" id="briefForm">
        <input id="bRole" placeholder="角色，如 B" required />
        <button type="submit">查看</button>
      </form>
      <div class="log" id="brief"></div>
    </section>

    <section>
      <h2>数值结算</h2>
      <form class="narr" id="settleForm">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <input id="sActor" placeholder="角色" required />
          <input id="sFact" placeholder="fact_ref" required />
        </div>
        <textarea id="sInputs" placeholder='inputs JSON，如 {"悟性":100}'></textarea>
        <button type="submit">提交结算</button>
        <div class="log" id="sLog"></div>
      </form>
    </section>

    <section>
      <h2>叙事调试</h2>
      <form class="narr" id="narrForm">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <input id="nRole" placeholder="角色" required />
          <input id="nFact" placeholder="fact_ref（可选）" />
        </div>
        <textarea id="nSlice" placeholder="世界书切片（可选）"></textarea>
        <button type="submit" id="nBtn">生成叙事</button>
        <div class="log" id="nLog"></div>
      </form>
    </section>

    <section>
      <h2>LLM 配置</h2>
      <div class="log" id="llmStatus" style="margin-bottom:8px">加载中…</div>
      <form class="narr" id="llmForm">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <select id="llmProvider">
            <option value="mock">mock</option>
            <option value="openai-compatible">openai-compatible</option>
          </select>
          <input id="llmModel" placeholder="model" />
        </div>
        <input id="llmBaseUrl" placeholder="BASE_URL" />
        <input id="llmApiKey" type="password" placeholder="API_KEY" />
        <button type="submit">保存并热切换</button>
        <div class="log" id="llmLog"></div>
      </form>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const routes = [];
let currentRole = "A";
let isGM = false;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const t = await r.text();
  let j;
  try { j = JSON.parse(t); } catch { j = t; }
  if (!r.ok) throw new Error(path + " → " + r.status + " " + (j && j.error ? j.error : typeof j === "string" ? j.slice(0,200) : ""));
  return j;
}

function pickRole() {
  const m = location.pathname.match(/^\/player\/([A-Za-z0-9_]+)$/);
  if (location.pathname === "/gm" || location.pathname === "/") { isGM = true; currentRole = "GM"; }
  else if (m) { isGM = false; currentRole = m[1]; }
  else { isGM = false; currentRole = new URLSearchParams(location.search).get("role") || "A"; }
  $("chatMain").style.display = isGM ? "none" : "";
  $("dashMain").style.display = isGM ? "" : "none";
  renderRoutes();
}

function renderRoutes() {
  const nav = $("routes");
  nav.innerHTML = "";
  for (const r of routes) {
    const a = document.createElement("a");
    a.textContent = r;
    a.href = r === "GM" ? "/gm" : "/player/" + r;
    a.className = (r === currentRole) ? "on" : "";
    a.onclick = (e) => { e.preventDefault(); location.href = a.href; };
    nav.appendChild(a);
  }
}

// ── Player chat ──
function renderChatStream(ledger) {
  const box = $("stream");
  const all = [...ledger.events.map(e=>({...e,side:false})), ...ledger.sideBranches.map(e=>({...e,side:true}))].sort((a,b)=>a.seq-b.seq);
  const parts = all.map(e => {
    const tag = e.side ? ' <span class="side-tag">' + (e.reason_code||"side") + "</span>" : "";
    const val = typeof e.value==="object" ? JSON.stringify(e.value) : String(e.value);
    return '<div class="msg event' + (e.side?" side":"") + '"><b>#' + e.seq + "</b> " + e.kind + " · " + e.fact_ref + " = " + val + tag +
      '<div class="who">' + e.actor + " · " + e.canon_status + "</div></div>";
  });
  const props = ledger.proposals||[];
  const propParts = props.map(p =>
    '<div class="msg narr"><div class="who">叙事 · ' + p.role + " · " + p.provider + "</div>" +
    '<div class="body">' + escapeHtml(p.narrative) + "</div>" +
    (p.suggested_value!==null&&p.suggested_value!==undefined ?
      '<div class="prop">建议值：' + escapeHtml(JSON.stringify(p.suggested_value)) + "</div>":"") +
    "</div>"
  );
  box.innerHTML = parts.join("") + propParts.join("") || '<div class="empty">账本为空</div>';
  box.scrollTop = box.scrollHeight;
}

async function renderPlayerPanel() {
  try {
    const p = await api("/api/panel/" + encodeURIComponent(currentRole));
    const l = p.layers||{};
    const mk = (cls, title, obj) => {
      const ks = Object.keys(obj||{});
      if (!ks.length) return '<div class="layer ' + cls + '"><h4>' + title + '</h4><div class="empty">（无）</div></div>';
      let body = "";
      for (const k of ks) body += "<div class='kv'><b>" + k + "</b><span>" + (typeof obj[k]==="object"?JSON.stringify(obj[k]):obj[k]) + "</span></div>";
      return '<div class="layer ' + cls + '"><h4>' + title + "</h4>" + body + "</div>";
    };
    const rumor = (l.rumor&&Object.keys(l.rumor).length)
      ? '<div class="layer rum"><h4>rumor</h4>' + Object.entries(l.rumor).map(([k,v])=>
          '<div class="rumor-item"><b>' + k + "</b>（" + v.blur_level + "）" + v.description + "</div>").join("") + "</div>"
      : '<div class="layer rum"><h4>rumor</h4><div class="empty">（无）</div></div>';
    $("playerPanel").innerHTML =
      '<h3>我的面板 · ' + currentRole + "</h3>" +
      mk("pub","public",l.public) + mk("priv","private",l.private) + rumor;
  } catch { $("playerPanel").innerHTML = '<div class="empty">面板加载失败</div>'; }
}

// ── GM ──
async function renderGmOverview() {
  try {
    const r = await api("/api/gm/overview");
    const all = [...r.events.map(e=>({...e,side:false})), ...r.sideBranches.map(e=>({...e,side:true}))].sort((a,b)=>a.seq-b.seq);
    $("dashStream").innerHTML = all.map(e=>{
      const tag = e.side ? ' <span class="side-tag">' + (e.reason_code||"side") + "</span>" : "";
      const val = typeof e.value==="object"?JSON.stringify(e.value):String(e.value);
      return '<div class="msg event" style="align-self:flex-start;max-width:100%">#' + e.seq + " · " + e.kind + " · " + e.fact_ref + " = " + val + tag +
        '<div class="who">' + e.actor + " · " + e.canon_status + "</div></div>";
    }).join("") +
    (r.proposals||[]).map(p=>
      '<div class="msg narr" style="max-width:100%;align-self:flex-start">' +
      '<div class="who">叙事 · ' + p.role + "（at_seq " + p.at_seq + "）</div>" +
      '<div class="body">' + escapeHtml(p.narrative) + "</div></div>"
    ).join("") || '<div class="empty">账本为空</div>';

    const keys = Object.keys(r.rolePanels||{});
    if (!keys.length) { $("rolePanels").innerHTML = '<div class="empty">暂无玩家角色</div>'; return; }
    $("rolePanels").innerHTML = keys.map(role=>{
      const p = r.rolePanels[role];
      const l = p.layers||{};
      const mk = (cls,t,obj)=>{
        const ks=Object.keys(obj||{});
        if(!ks.length)return "";
        let body="";
        for(const k of ks) body+="<div class='kv'><b>"+k+"</b><span>"+(typeof obj[k]==="object"?JSON.stringify(obj[k]):obj[k])+"</span></div>";
        return '<div class="layer '+cls+'"><h4>'+t+"</h4>"+body+"</div>";
      };
      const rumor=(l.rumor&&Object.keys(l.rumor).length)
        ?'<div class="layer rum"><h4>rumor</h4>'+Object.entries(l.rumor).map(([k,v])=>
          '<div class="rumor-item"><b>'+k+"</b>（"+v.blur_level+"）"+v.description+"</div>").join("")+"</div>":"";
      return '<div class="role-panel"><h4>角色 '+role+'</h4>'+mk("pub","public",l.public)+mk("priv","private",l.private)+rumor+"</div>";
    }).join("");
  } catch {}
}

// ── Refresh ──
async function refresh() {
  try {
    const root = await api("/");
    routes.length = 0;
    for (const r of root.roles||[]) routes.push(r);
    if (!isGM && !routes.includes(currentRole) && routes.includes("A")) currentRole = "A";
    $("meta").textContent = "seq " + root.seq + " · " + root.schema_version + " · LLM " + root.llm;
    renderRoutes();
    if (!isGM) {
      const ledger = await api("/api/ledger");
      renderChatStream(ledger);
      renderPlayerPanel();
    } else {
      renderGmOverview();
    }
  } catch (e) {
    $("meta").textContent = "未连接：" + e.message;
  }
}

// ── Prompts ──
let promptsLoaded = false;
function maybeLoadPrompts(force) {
  if (!isGM && (force||!promptsLoaded)) { promptsLoaded = true; loadPrompts(); }
}
async function loadPrompts() {
  const box = $("chips");
  try {
    const r = await api("/api/prompts/" + encodeURIComponent(currentRole));
    const keys = Object.keys(r.prompts||{});
    if (!keys.length) { box.innerHTML = '<span class="hint">LLM 未给出选项</span>'; return; }
    box.innerHTML = keys.map(k=>'<button class="chip" data-p="'+escapeHtml(k)+'">'+escapeHtml(k)+"</button>").join("");
    for (const b of box.querySelectorAll(".chip")) b.onclick = ()=>sendNarrative(b.dataset.p);
  } catch { box.innerHTML = '<span class="hint">选项加载失败</span>'; }
}

async function sendNarrative(text) {
  if (!text||!text.trim()) return;
  $("busy").textContent = "叙事生成中…";
  $("chatInput").value = "";
  const box = $("stream");
  const p = document.createElement("div");
  p.className = "msg player";
  p.innerHTML = '<div class="who">你（'+currentRole+'）</div><div class="body">'+escapeHtml(text)+"</div>";
  box.appendChild(p);
  box.scrollTop = box.scrollHeight;
  try {
    await api("/api/narrative/"+encodeURIComponent(currentRole),{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text})
    });
    $("busy").textContent = "";
    promptsLoaded = false;
    await refresh();
    maybeLoadPrompts(true);
  } catch (e) {
    $("busy").textContent = "";
    box.insertAdjacentHTML("beforeend",'<div class="msg event" style="border-color:var(--err)">叙事失败：'+escapeHtml(e.message)+"</div>");
    box.scrollTop = box.scrollHeight;
  }
}

$("sendBtn").onclick = ()=>sendNarrative($("chatInput").value);
$("chatInput").addEventListener("keydown",(e)=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("sendBtn").click();}
});

// ── GM forms ──
function log(el,msg,isErr){el.innerHTML='<div class="'+(isErr?"err":"ok")+'">'+escapeHtml(msg)+"</div>"+el.innerHTML;}

$("settleForm").onsubmit = async(e)=>{
  e.preventDefault();
  let inputs={};
  const raw=$("sInputs").value.trim();
  if(raw){try{inputs=JSON.parse(raw);}catch{log($("sLog"),"inputs 非法 JSON",true);return;}}
  try{
    const r=await api("/api/settle",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({actor:$("sActor").value||"GM",fact_ref:$("sFact").value,inputs})});
    log($("sLog"),r.ok?"结算成功 seq="+r.seq+" → "+JSON.stringify(r.result):"拒绝："+r.reason,!r.ok);
    refresh();
  }catch(err){log($("sLog"),err.message,true);}
};

$("narrForm").onsubmit = async(e)=>{
  e.preventDefault();
  $("nBtn").disabled=true;
  try{
    const r=await api("/api/narrative/"+encodeURIComponent($("nRole").value||"A"),{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fact_ref:$("nFact").value.trim()||undefined,worldbookSlice:$("nSlice").value.trim()||undefined})
    });
    const p=r.proposal;
    log($("nLog"),"at_seq="+p.at_seq+" · "+p.usage.inputTokens+"/"+p.usage.outputTokens+" tokens："+p.narrative,false);
    refresh();
  }catch(err){log($("nLog"),err.message,true);}
  $("nBtn").disabled=false;
};

$("briefForm").onsubmit = async(e)=>{
  e.preventDefault();
  try{
    const r=await api("/api/briefing/"+encodeURIComponent($("bRole").value));
    const items=r.items.map(i=>"· "+i.render).join("\n");
    $("brief").innerHTML=items?"<pre style='white-space:pre-wrap;font-size:13px;font-family:var(--font-narr)'>"+escapeHtml(items)+"</pre>":"<span class='ok'>无 rumor 条目</span>";
  }catch(err){$("brief").textContent="briefing 失败："+err.message;}
};

async function loadLlmConfig(){
  try{
    const r=await api("/api/config/llm");
    $("llmStatus").textContent="当前："+(r.current.provider??"unknown")+" · live "+r.live;
    if(r.current.provider==="openai-compatible"){
      $("llmProvider").value="openai-compatible";
      $("llmBaseUrl").value=r.current.baseUrl||"";
      $("llmApiKey").value=r.current.apiKey||"";
      $("llmModel").value=r.current.model&&r.current.model!=="gpt-4o-mini"?r.current.model:"";
    }
  }catch{}
}

$("llmForm").onsubmit = async(e)=>{
  e.preventDefault();
  const btn=e.target.querySelector("button");
  btn.disabled=true;
  try{
    const r=await api("/api/config/llm",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({provider:$("llmProvider").value,baseUrl:$("llmBaseUrl").value.trim()||undefined,
        apiKey:$("llmApiKey").value.trim()||undefined,model:$("llmModel").value.trim()||undefined})});
    log($("llmLog"),"已切换 → "+r.live,false);
    refresh();
  }catch(err){log($("llmLog"),err.message,true);}
  btn.disabled=false;
};

pickRole();
refresh();
maybeLoadPrompts(false);
if (isGM) { loadLlmConfig(); setInterval(loadLlmConfig,10000); setInterval(refresh,3000); }
else { setInterval(refresh,3000); }
</script>
</body>
</html>
